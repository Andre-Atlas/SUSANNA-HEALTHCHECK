version: '3.8'

services:
  backend:
    build:
      context: ./susana_rag_backend
      dockerfile: Dockerfile
    container_name: susana-backend
    env_file:
      - ./susana_rag_backend/.env
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:8b
      - CHROMA_PERSIST_DIRECTORY=data/chroma_db
    volumes:
      - ./susana_rag_backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - susana-network

  frontend:
    build:
      context: ./susana-ui
      dockerfile: Dockerfile
    container_name: susana-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - susana-network

networks:
  susana-network:
    driver: bridge
