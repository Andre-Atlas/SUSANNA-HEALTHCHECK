services:
  backend:
    build:
      context: ./susana_rag_backend
      dockerfile: Dockerfile
    container_name: susana-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - CHROMA_DIR=/app/data/chroma_db
      - APP_DB_PATH=/app/data/db/susana_app.db
      - INGESTION_API_KEY=${INGESTION_API_KEY:-susana-docker-local-key-2026}
      - RELEVANCE_CONFIDENT_THRESHOLD=${RELEVANCE_CONFIDENT_THRESHOLD:-0.35}
      - ONLINE_SEARCH_ENABLED=${ONLINE_SEARCH_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - susana_chroma_data:/app/data/chroma_db
      - susana_app_data:/app/data/db
    ports:
      - "${API_PORT:-8000}:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./susana-ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
        - BACKEND_URL=http://backend:8000
    container_name: susana-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: susana-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  susana_chroma_data:
    name: susana_chroma_data
  susana_app_data:
    name: susana_app_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
