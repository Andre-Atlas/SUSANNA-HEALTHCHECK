  [52.5, V(4.6, 2.8, 10), V(4.4, 0.9, 0)], [56.5, V(0.4, 4.2, 17), V(0.4, 0.8, 0)], [60, V(0.4, 4.6, 18.5), V(0.4, 0.8, 0)]
];
function cameraAt(t) {
  let i = 0; while (i + 1 < CAM.length && CAM[i + 1][0] <= t) i++;
  const a = CAM[i], b = CAM[Math.min(i + 1, CAM.length - 1)], k = b[0] > a[0] ? smooth((t - a[0]) / (b[0] - a[0])) : 0;
  camera.position.lerpVectors(a[1], b[1], k);
  camera.lookAt(new THREE.Vector3().lerpVectors(a[2], b[2], k));
}

// ───── o quadro no instante t ─────
let lastWords = -1, lastAnswerMode = '';
function frame(t) {
  cameraAt(t);
  const bob = Math.sin(t * 1.6) * 0.05;
  // 1 · gancho (0–7 s)
  const hookOn = 1 - seg(t, 6.2, 7.4);
  setOpacity(hook, hookOn);
  qBubble.scale.setScalar(Math.max(0.001, seg(t, 0.2, 1.0))); qBubble.position.y = 2.6 + bob;
  brain.scale.setScalar(Math.max(0.001, seg(t, 1.2, 2.0))); brain.rotation.y = Math.sin(t) * 0.25;
  xMark.scale.setScalar(Math.max(0.001, seg(t, 2.6, 3.1)));
  hookDocs.forEach((d, i) => {
    const a = i / 6 * Math.PI * 2 + t * 0.4, from = V(Math.cos(a) * 7, 1 + Math.sin(a) * 3, -3), to = V(1.6 + (i % 3) * 0.7, 0.3 + Math.floor(i / 3) * 0.95, 0.5);
    d.position.lerpVectors(from, to, seg(t, 3.4 + i * 0.25, 5.2 + i * 0.25)); d.rotation.y = (1 - seg(t, 3.4, 5.8)) * 3;
  });
  officialLabel.material.opacity = seg(t, 5.2, 5.8) * hookOn;
  // 2 · ChromaDB e checagem (7–18 s)
  const s2 = seg(t, 6.8, 8);
  setOpacity(db, s2); db.rotation.y = t * 0.3;
  pool.forEach((d, i) => {
    const fan = fanPos(i), rise = seg(t, 7.6 + i * 0.08, 9.4 + i * 0.08), top = TOP.indexOf(i);
    d.visible = t > 7.4;
    d.position.lerpVectors(V(X.db, -0.2, 0), fan, rise); d.position.y += Math.sin(t * 2 + i) * 0.04;
    d.rotation.set(0, Math.sin(t + i) * 0.2, 0);
    const dimmed = seg(t, 10, 11) * (top < 0 && i !== REJECT ? 1 : 0);
    d.children[0].material.color.setHex(top >= 0 && t > 10 ? 0x67e8f9 : i === REJECT && t > 14.6 ? 0xf87171 : 0xf8fafc);
    d.children[0].material.emissive.copy(d.children[0].material.color);
    d.children[0].material.emissiveIntensity = top >= 0 && t > 10 ? 0.7 : 0.25;
    setOpacity(d, (1 - 0.8 * dimmed) * (1 - seg(t, 17.4, 18.4) * (top < 0 ? 1 : 0)));
    if (top >= 0) {
      const go = seg(t, 12 + top * 0.5, 13.6 + top * 0.5);
      const g0 = V(X.gate - 0.6 + top * 0.6, 0.7 + (top - 1) * 0.1, 0.3);
      d.position.lerpVectors(d.position.clone(), g0, go);
      // 3 · do portão até as vagas do prompt (20–23 s)
      const slot = [SLOT.t1, SLOT.t2, SLOT.t3][top].clone().add(prompt.position);
      const into = seg(t, 20 + top * 0.6, 21.6 + top * 0.6);
      if (into > 0) { d.position.lerpVectors(g0, slot, into); d.scale.setScalar(1 - 0.25 * into); d.rotation.set(0, 0, 0); }
      tags[top].position.copy(d.position).add(V(0, -0.47, 0.1)); tags[top].material.opacity = seg(t, 21.6 + top * 0.6, 22.2 + top * 0.6) * (1 - seg(t, 26, 27));
    }
    if (i === REJECT) {
      const g0 = V(X.gate - 0.9, 1.2, 0.3), go = seg(t, 13.8, 14.6);
      if (go > 0) d.position.lerpVectors(d.position.clone(), g0, go);
      const fall = seg(t, 14.8, 16.2); if (fall > 0) { d.position.y -= fall * 2.6; d.rotation.z = fall * 1.2; }
    }
  });
  // portão e globo: aparecem na cena 2, saem durante a montagem e voltam na visão geral final
  const s2vis = seg(t, 9.5, 10.5) * (1 - seg(t, 18.4, 19.4)) + seg(t, 55, 56.5);
  setOpacity(gate, s2vis); gate.rotation.y = Math.sin(t * 0.7) * 0.3;
  gate.children[0].material.emissiveIntensity = 0.35 + (t > 12 && t < 15 ? 0.5 * (0.5 + 0.5 * Math.sin(t * 8)) : 0);
  check.scale.setScalar(0.6 * Math.max(0.001, seg(t, 13.6, 14.1)));
  setOpacity(globe, Math.min(seg(t, 15.8, 16.6), s2vis)); globe.rotation.y = t * 0.6; globe.scale.setScalar(1 + 0.06 * Math.sin(t * 5));
  // 3 · montagem do prompt (18–33 s)
  const pIn = seg(t, 18, 19.2), pToChip = seg(t, 26.2, 29.4);
  setOpacity(prompt, pIn);
  prompt.position.lerpVectors(V(X.prompt, 0.7, 0), V(X.chip, 0.7, 0.2), pToChip);
  prompt.scale.setScalar(Math.max(0.001, 1 - 0.85 * pToChip));
  const slotWorld = s => s.clone().multiplyScalar(prompt.scale.x).add(prompt.position);
  rules.visible = t > 18.6; rules.position.lerpVectors(V(X.prompt - 2.6, 3.2, 0.5), slotWorld(SLOT.rules), seg(t, 18.8, 20)); rules.scale.setScalar(Math.max(0.001, 0.9 * prompt.scale.x));
  rulesLabel.position.copy(rules.position).add(V(0.75 * prompt.scale.x, 0, 0.1)); rulesLabel.material.opacity = seg(t, 19.8, 20.3) * (1 - pToChip);
  hist.visible = t > 23; hist.position.lerpVectors(V(X.prompt + 2.6, -1.4, 0.5), slotWorld(SLOT.hist), seg(t, 23.2, 24.6)); hist.scale.setScalar(Math.max(0.001, prompt.scale.x));
  histLabel.position.copy(hist.position).add(V(0, -0.38 * prompt.scale.x, 0.1)); histLabel.material.opacity = seg(t, 24.4, 24.9) * (1 - pToChip);
  pool.forEach((d, i) => { const top = TOP.indexOf(i); if (top >= 0 && t > 26.2) { d.position.copy(slotWorld([SLOT.t1, SLOT.t2, SLOT.t3][top])); d.scale.setScalar(Math.max(0.001, 0.75 * prompt.scale.x)); } });
  [rules, hist, ...TOP.map(i => pool[i])].forEach(o => { if (t > 29.2) o.visible = false; });
  if (t > 29.2) prompt.visible = false;
  promptTitle.material.opacity = pIn * (1 - pToChip);
  fastapiLabel.material.opacity = seg(t, 19, 19.6) * (1 - seg(t, 26, 26.8));
  setOpacity(chip, seg(t, 24.5, 26)); chip.rotation.y = Math.sin(t * 0.8) * 0.25;
  const thinking = t > 29.3 && t < 45 ? 0.5 + 0.5 * Math.sin(t * 6) : 0;
  const failing = t > 50.2 && t < 53.6;
  core.material.color.setHex(failing ? 0xef4444 : 0xf472b6); core.material.emissive.setHex(failing ? 0xef4444 : 0xf472b6);
  core.material.emissiveIntensity = 0.4 + 0.6 * thinking + (failing ? 0.5 * (0.5 + 0.5 * Math.sin(t * 14)) : 0);
  setOpacity(thermo, seg(t, 29.6, 30.6) * (1 - seg(t, 33.4, 34.2)));
  mercury.scale.y = 0.15 + 0.1 * seg(t, 30.4, 31.6); mercury.position.y = -0.75 + mercury.scale.y / 2;
  // 4 · entrega token a token (33–46 s)
  setOpacity(web, seg(t, 32, 33.5)); web.rotation.y = Math.sin(t * 0.5) * 0.06;
  let words = 0;
  TOKENS.forEach((g, i) => {
    const t0 = 34.2 + i * 0.75, q = (t - t0) / 1.6;
    g.visible = q > 0 && q < 1;
    if (g.visible) { g.position.copy(tokenPath.getPoint(smooth(q))); g.rotation.y = t * 3; }
    if (q >= 1) words = i + 1;
  });
  // 5 · citações, sugestões e falha simulada (46–60 s)
  const fallback = seg(t, 52.2, 53.6);
  const mode = fallback > 0.98 ? 'fallback' : 'llm';
  if (words !== lastWords || mode !== lastAnswerMode) {
    lastWords = words; lastAnswerMode = mode;
    if (mode === 'fallback') drawAnswer('[Trecho oficial] UBS 2 Taguatinga · QND Lote 1 · vacinação de segunda a sexta, 7h às 19h', '#cffafe', '#083344');
    else drawAnswer(ANSWER.slice(0, words).join(' ') + (words < ANSWER.length && t > 34 ? ' ▍' : ''));
  }
  cite.material.opacity = seg(t, 46.4, 47.2) * (1 - seg(t, 52, 52.4));
  chips.forEach((c, i) => { c.material.opacity = seg(t, 47.4 + i * 0.5, 48.2 + i * 0.5) * (1 - seg(t, 52, 52.4)); });
  failLabel.material.opacity = seg(t, 50.3, 50.8) * (1 - seg(t, 54.5, 55.2));
  fallbackDoc.visible = t > 51 && t < 53.7;
  if (fallbackDoc.visible) { fallbackDoc.position.copy(fallbackPath.getPoint(seg(t, 51, 53.5))); fallbackDoc.rotation.y = t * 2; }
  // textos de tela
  CAPTIONS.forEach(([a, b, sp]) => { sp.material.opacity = showText ? seg(t, a, a + 0.5) * (1 - seg(t, b - 0.5, b)) : 0; });
  finalTitle.material.opacity = seg(t, 55.6, 56.8);
  renderer.render(scene, camera);
}

// ───── voz da narração (Web Audio) ─────
// Cada bloco começa no segundo indicado; o relógio do áudio também comanda a animação, para não haver descompasso.
const VOICE_AT = [0.1, 7.3, 18.3, 33.3, 46.3];
const voice = { on: true, ctx: null, bufs: [], gain: null, dest: null, sources: [], ready: null };
function initVoice() {
  if (voice.ready) return voice.ready;
  voice.ready = (async () => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    voice.ctx = ctx; voice.gain = ctx.createGain(); voice.gain.connect(ctx.destination);
    voice.dest = ctx.createMediaStreamDestination(); voice.gain.connect(voice.dest);
    voice.bufs = await Promise.all((window.VOICE_DATA || []).map(b64 =>
      fetch('data:audio/mpeg;base64,' + b64).then(r => r.arrayBuffer()).then(a => ctx.decodeAudioData(a))));
  })();
  return voice.ready;
}
function stopVoice() { voice.sources.forEach(s => { try { s.stop(); } catch (e) {} }); voice.sources = []; }
function scheduleVoice(fromT) {
  stopVoice();
  if (!voice.on || !voice.ctx) return;
  const now = voice.ctx.currentTime;
  voice.bufs.forEach((buf, i) => {
    const st = VOICE_AT[i];
    if (st + buf.duration <= fromT) return;
    const src = voice.ctx.createBufferSource(); src.buffer = buf; src.connect(voice.gain);
    src.start(now + Math.max(0, st - fromT), Math.max(0, fromT - st)); voice.sources.push(src);
  });
}

// ───── reprodução e gravação ─────
const ui = document.getElementById('ui'), playBtn = document.getElementById('play'), timeEl = document.getElementById('time'), recBtn = document.getElementById('rec'), msg = document.getElementById('msg');
let playing = false, t = Number(qs.get('t') || 0), last = null, recorder = null, clock = null;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
async function setPlaying(p) {
  playing = p; last = null; clock = null; playBtn.textContent = p ? '⏸ Pausar' : '▶ Reproduzir';
  if (!p) { stopVoice(); return; }
  await initVoice(); await voice.ctx.resume();
  if (!playing) return;
  clock = { t0: t, a0: voice.ctx.currentTime };
  scheduleVoice(t);
}
playBtn.addEventListener('click', () => { if (t >= DURATION) t = 0; setPlaying(!playing); });
document.getElementById('restart').addEventListener('click', () => { t = 0; frame(0); timeEl.textContent = fmt(0) + ' / 1:00'; if (playing) setPlaying(true); });
// voltar alguns segundos: imagem e voz recuam juntas
function seek(newT) {
  if (recorder) return;
  t = clamp(newT, 0, DURATION); lastWords = -1;
  if (playing && voice.ctx && clock) { clock = { t0: t, a0: voice.ctx.currentTime }; scheduleVoice(t); }
  frame(t); timeEl.textContent = fmt(t) + ' / 1:00';
}
document.getElementById('back').addEventListener('click', () => seek(t - 5));
const vozBtn = document.getElementById('voz');
vozBtn.addEventListener('click', () => { voice.on = !voice.on; vozBtn.textContent = 'Voz: ' + (voice.on ? 'sim' : 'não'); vozBtn.setAttribute('aria-pressed', String(voice.on)); if (playing) setPlaying(true); });
const txtBtn = document.getElementById('txt');
txtBtn.addEventListener('click', () => { showText = !showText; txtBtn.textContent = 'Texto na tela: ' + (showText ? 'sim' : 'não'); txtBtn.setAttribute('aria-pressed', String(showText)); frame(t); });
function say(text, ms = 5000) { msg.textContent = text; msg.style.display = 'block'; clearTimeout(say.h); if (ms) say.h = setTimeout(() => { msg.style.display = 'none'; }, ms); }
recBtn.addEventListener('click', async () => {
  if (recorder) return;
  await initVoice(); await voice.ctx.resume();
  const types = voice.on
    ? ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
    : ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x));
  if (!type) { say('Este navegador não grava vídeo. Use o Chrome ou o Edge.'); return; }
  const chunks = [], stream = renderer.domElement.captureStream(30);
  if (voice.on) voice.dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  recorder = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type })); a.download = 'susana-como-a-resposta-e-construida.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    recorder = null; recBtn.classList.remove('rec'); recBtn.textContent = '● Gravar vídeo (1 min)'; ui.classList.remove('hide');
    say('Vídeo salvo na pasta de downloads (' + ext.toUpperCase() + ', 1920×1080, 30 fps).', 8000);
  };
  t = 0; frame(0); recorder.start(500); await setPlaying(true);
  recBtn.classList.add('rec'); recBtn.textContent = '● Gravando…'; ui.classList.add('hide');
  say('Gravando 1 minuto. Deixe esta aba aberta e visível até terminar.', 0);
});
function loop(ms) {
  requestAnimationFrame(loop);
  if (playing) {
    // com o áudio ativo, o tempo vem do relógio do áudio; sem ele, do relógio da tela
    if (clock) t = Math.min(DURATION, clock.t0 + (voice.ctx.currentTime - clock.a0));
    else if (last !== null) t = Math.min(DURATION, t + (ms - last) / 1000);
    last = ms;
    if (t >= DURATION) { setPlaying(false); if (recorder) setTimeout(() => recorder && recorder.stop(), 300); }
  }
  frame(t);
  timeEl.textContent = fmt(t) + ' / 1:00';
}
// ?still=1 desenha um único quadro (para conferir imagens sem animar)
if (qs.has('still')) { frame(t); ui.style.display = 'none'; } else requestAnimationFrame(loop);
window.addEventListener('keydown', e => {
  if (e.key === ' ' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); playBtn.click(); }
  else if (e.key === 'ArrowLeft' || e.key === 'r' || e.key === 'R') { e.preventDefault(); seek(t - 5); }
});
</script>
