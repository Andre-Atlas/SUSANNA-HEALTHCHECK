services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: susana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: susana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - susana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d susana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  susana_pgdata:
